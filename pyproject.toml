[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "runledger"
version = "0.1.0"
description = "Flight recorder for long GPU jobs on a single machine."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Run Ledger contributors" }]
keywords = ["gpu", "nvidia-smi", "cli", "lora", "comfyui"]
classifiers = [
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
runledger = "runledger.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
runledger = ["dashboard.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
